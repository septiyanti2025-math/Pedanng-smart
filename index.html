
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedagang Smart - Aplikasi Kasir</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🛒 PEDAGANG SMART</h1>
            <p>Aplikasi Kasir Digital Sederhana</p>
        </header>

        <div class="form-box">
            <h2>Input Barang</h2>

            <label>Nama Barang</label>
            <input type="text" id="nama" placeholder="Masukkan nama barang">

            <label>Harga Barang (Rp)</label>
            <input type="number" id="harga" placeholder="Masukkan harga">

            <label>Jumlah Barang</label>
            <input type="number" id="jumlah" placeholder="Masukkan jumlah">

            <button onclick="tambahBarang()">Tambah Barang</button>
        </div>

        <div class="table-box">
            <h2>Daftar Penjualan</h2>

            <table>
                <thead>
                    <tr>
                        <th>Barang</th>
                        <th>Harga</th>
                        <th>Jumlah</th>
                        <th>Total</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="daftarBarang"></tbody>
            </table>

            <div class="total">
                <h3>Total Belanja:</h3>
                <h2 id="totalBelanja">Rp 0</h2>
            </div>

            <button class="reset" onclick="resetBelanja()">
                Reset Penjualan
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
